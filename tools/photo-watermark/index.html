<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>照片水印 · 机型 / 时间 / 地点</title>
<meta name="description" content="在浏览器本地为照片添加机型、拍摄时间与地点水印，照片不上传，隐私安全。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1>照片水印</h1>
    <p class="sub">读取相机 EXIF，叠加机型、拍摄时间与拍摄地点。<strong>照片全程留在本机</strong>，不会上传到任何服务器。</p>
  </header>

  <main class="layout">
    <!-- 左侧：图片舞台 -->
    <section class="stage">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择照片">
        <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M8 5l1.2-1.6h5.6L16 5"></path>
        </svg>
        <p class="dz-title">拖入照片，或点击选择</p>
        <p class="dz-hint">JPG / PNG / WebP / HEIC · iPhone 原图可直接拖进来</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif,image/*" hidden>
      </div>

      <div class="canvas-box" id="canvasBox" hidden>
        <canvas id="preview"></canvas>
      </div>
    </section>

    <!-- 右侧：控制面板 -->
    <aside class="panel" id="panel">
      <div class="field">
        <label for="f-model">机型</label>
        <input id="f-model" type="text" autocomplete="off" spellcheck="false" placeholder="iPhone 15 Pro">
      </div>

      <div class="field">
        <label for="f-when">时间</label>
        <input id="f-when" type="text" autocomplete="off" spellcheck="false" placeholder="2026.10.29 21:46">
      </div>

      <div class="field">
        <div class="label-row">
          <label for="f-place">地点</label>
          <span class="tag" id="placeStatus"></span>
        </div>
        <input id="f-place" type="text" autocomplete="off" spellcheck="false" placeholder="四川省绵阳市涪城区">
        <button type="button" class="link-btn" id="btnRegeo">重新解析 GPS 定位</button>
      </div>

      <div class="field">
        <label for="f-params">拍照参数 <span class="opt">可选</span></label>
        <input id="f-params" type="text" autocomplete="off" spellcheck="false" placeholder="f/1.8 · 1/120s · ISO 200">
      </div>

      <div class="divider"></div>

      <div class="toggles">
        <label class="check"><input type="checkbox" id="optParams" checked><span>显示参数行</span></label>
        <label class="check"><input type="checkbox" id="optPlace" checked><span>显示地点</span></label>
      </div>

      <div class="field slider-field">
        <div class="label-row">
          <label for="optSize">水印大小</label>
          <span class="tag mono" id="sizeLabel">100%</span>
        </div>
        <input type="range" id="optSize" min="60" max="180" value="100" step="5">
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="btnDownload" disabled>下载水印照片</button>
        <button type="button" class="btn ghost" id="btnReset" disabled>换一张</button>
      </div>

      <p class="notice" id="notice" hidden></p>
    </aside>
  </main>

  <footer class="foot">
    <span>地点由 <a href="https://www.tianditu.gov.cn/" target="_blank" rel="noopener">天地图</a> 逆地理编码提供</span>
    <span class="dot">·</span>
    <span id="netState">检测中…</span>
  </footer>
</div>

<script src="./assets/exifr.umd.js"></script>
<script src="./assets/config.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
