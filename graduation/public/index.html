<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青春纪念册</title>
    <style>
        :root {
            /* 保持与密码页完全一致的色彩系统 */
            --primary-color: #84A98C;      
            --primary-hover: #6B8E73;      
            --bg-color: #F9FAFB;           
            --card-bg: #FFFFFF;            
            --text-main: #2C3E2D;          
            --text-sub: #7A8B7C;           
            --accent-color: #E4DCCF;       /* 暖沙色，用于点缀 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-main);
        }

        /* 保持背景柔和光斑 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 350px; height: 350px;
            background: var(--primary-color);
            top: -150px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: var(--accent-color);
            bottom: -150px; right: -150px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* 核心内容区样式 */
        .message-body {
            text-align: left;
            line-height: 1.9;
            color: #4A5D4B;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .message-body p {
            margin-bottom: 16px;
            text-indent: 2em; /* 首行缩进，更有信件感 */
        }

        /* 照片/图片展示框 */
        .photo-frame {
            width: 100%;
            aspect-ratio: 4/3; /* 保持比例 */
            background: linear-gradient(135deg, #E8ECE9 0%, #F4F1EB 100%);
            border-radius: 16px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 14px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
        }
        
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 标签区 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .tag {
            background: #F0F4F1;
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 底部签名 */
        .signature {
            border-top: 1px dashed #E8ECE9;
            padding-top: 24px;
            text-align: right;
            color: var(--text-sub);
            font-size: 14px;
            font-style: italic;
        }

        .signature strong {
            color: var(--text-main);
            font-style: normal;
            font-size: 16px;
            display: block;
            margin-bottom: 4px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
                border-radius: 20px;
            }
            h1 { font-size: 22px; }
            .message-body { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon">🌿</div>
            <h1 id="pageTitle">毕业纪念册</h1>
            <p class="subtitle" id="pageSubtitle">编号：00 · 愿前程似锦</p>
            
            <!-- 照片区域 (可替换为真实图片) -->
            <div class="photo-frame" id="photoArea">
                <!-- 如果有图片，取消下面这行的注释并替换 src -->
                <img src="https://pan.qzyun.net/f/Dor5fp/%E6%B0%B4%E5%A1%94.jpg" alt="水塔.jpg" title="水塔.jpg" />
                <!-- <span>📷 这里可以放一张你们的合照</span> -->
            </div>

            <!-- 寄语正文 -->
            <div class="message-body">
                <p id="text1">见字如面。当你用手机碰触这张卡片时，属于我们的记忆便再次被唤醒。</p>
                <p id="text2">感谢那些一起度过的晚修、一起赶过的作业，还有那些在课间的漫谈。毕业不是结束，而是下一场山海的开始。</p>
                <p id="text3">无论未来你走到哪里，愿你始终保持热爱，奔赴下一场山海。</p>
            </div>

            <!-- 标签 -->
            <div class="tags">
                <span class="tag">#毕业快乐</span>
                <span class="tag">#前程似锦</span>
                <span class="tag">#友谊长存</span>
            </div>

            <!-- 签名 -->
            <div class="signature">
                <strong>你的同学：陈智铭</strong>
                2026年 夏 · 于 [东莞]
            </div>
        </div>
    </div>
