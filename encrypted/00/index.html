<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码保护页面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .lock-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #667eea;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-input::placeholder {
            color: #adb5bd;
        }

        .unlock-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(231, 76, 60, 0.1);
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            .password-input, .unlock-btn {
                padding: 12px 15px;
                font-size: 16px; /* 防止iOS缩放 */
            }
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="lock-icon">🔒</div>
            <h2>请输入密码访问内容<br>编号：00</h2>
            
            <div id="password-form">
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password" 
                        class="password-input"
                        placeholder="输入访问密码"
                        autocomplete="off"
                    >
                </div>
                
                <button class="unlock-btn" onclick="decryptContent()">
                    解锁内容
                </button>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
                
                <div class="error-message" id="error">
                    密码错误，请重试
                </div>
            </div>
        </div>
    </div>

    <div class="content" id="content">
        <!-- 解密后的内容将显示在这里 -->
    </div>

        function decryptContent() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            
            if (!password.trim()) {
                showError('请输入密码');
                return;
            }
            
            // 显示加载动画
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            
            // 模拟解密过程（实际解密）
            setTimeout(() => {
                try {
                    const decrypted = CryptoJS.AES.decrypt(encryptedContent, password);
                    const originalText = decrypted.toString(CryptoJS.enc.Utf8);
                    
                    if (originalText) {
                        // 解密成功
                        document.getElementById('content').innerHTML = originalText;
                        document.getElementById('password-form').parentElement.parentElement.style.display = 'none';
                        document.getElementById('content').style.display = 'block';
                    } else {
                        showError('密码错误，请重试');
                    }
                } catch (e) {
                    showError('解密失败，请重试');
                }
                
                // 隐藏加载动画
                loadingDiv.style.display = 'none';
            }, 500);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // 3秒后自动隐藏错误信息
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
        
        // 回车键触发解密
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                decryptContent();
            }
        });
        
        // 密码框获得焦点
        document.getElementById('password').focus();
    </script>

</html>
